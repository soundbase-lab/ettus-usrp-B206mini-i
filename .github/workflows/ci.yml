# CI for a SoundBase plugin.
#
# Three things are checked, in increasing order of what they prove:
#
#   1. the manifest validates against the contract's own JSON schema
#   2. the test suite passes
#   3. the plugin actually boots, handshakes, and serves a trace over HTTP
#
# (3) is the one that catches what unit tests miss. A plugin that passes its
# tests but cannot complete the stdout handshake is invisible to SoundBase,
# and the failure looks like "my plugin does not appear" with nothing in the
# logs to explain it.
#
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The OS matrix comes from `os` in package.json — npm's own platform field,
  # which it enforces on install. A plugin that does not run everywhere then
  # says so in one place instead of two that drift apart, and CI stops failing
  # on a platform nobody ever intended to support.
  #
  # A plugin with no `os` field gets the full matrix, which is the right
  # default: if your plugin talks to hardware, the OS matrix is still worth
  # having — path handling, process termination and line endings differ, and
  # those are exactly the bugs that reach users first.
  platforms:
    runs-on: ubuntu-latest
    outputs:
      runners: ${{ steps.list.outputs.runners }}
      primary: ${{ steps.list.outputs.primary }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # No install: the script reads package.json and nothing else.
      - id: list
        run: |
          echo "runners=$(node scripts/ci-platforms.mjs)" >> "$GITHUB_OUTPUT"
          echo "primary=$(node scripts/ci-platforms.mjs --primary)" >> "$GITHUB_OUTPUT"

  test:
    needs: platforms
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.platforms.outputs.runners) }}
        node: [22, 24]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          # `cache: npm` is a hard error when there is no lockfile to key on,
          # and a repository made from this template has none until someone
          # commits their first install. Cache from then on, not before.
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install
        shell: bash
        # `npm ci` needs a lockfile; `npm install` writes one. Commit the
        # lockfile it produces and every later run takes the reproducible path.
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Check the plugin is well-formed
        run: npm run doctor

      - name: Validate the manifest against the contract schema
        run: npm run manifest

      - name: Test
        run: npm test

  boot:
    # Proving the plugin starts is cheap and independent of the test matrix.
    # One runner is enough, and it has to be one this plugin actually supports.
    needs: platforms
    runs-on: ${{ needs.platforms.outputs.primary }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
      - name: Install
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Boot, handshake, and serve a trace
        run: npm run smoke
